# 본 실험 규모 측정 (M3 준비 ③): 동시 실행 결정론 · 처리량 · 본 실험 판 수. 규칙은 DECISIONS 27절.
# 실행 (측정은 한 번만. 학습 결과는 남기지 않고 해시 · 게임-틱 합 · 시간만 남긴다, 27.2):
#   uv run --extra pacman python scripts/measure_scale.py run configs/scale_v1.yaml
#   uv run python scripts/measure_scale.py report runs/scale_v1
# engine · time · odor · phero · pacman · run 블록은 configs/integ_v1.yaml에서 값을 바꾸지 않고 복사했다.
# `condition`, `ghosts`(b1이면 original)는 scripts/run_parallel.py가 조건마다 채운다. 아래 ghosts는 b1이 아닌 조건의 뇌.
# 이 파일은 관리자 소유다.
experiment: scale_v1
seeds: [7100, 7101, 7102, 7103, 7104, 7105, 7106, 7107, 7108, 7109]
n_games: 30

engine: {kind: real, lives: 3, pacman_speed: 1.0, fly_speed: 1.0,
         b1: {force_reversal: original, scatter_chase_s: [7, 20, 7, 20, 5, 20, 5],
              scatter_targets: [[-3, 25], [-3, 2], [31, 27], [31, 0]],
              pinky_ahead: 4, inky_ahead: 2, clyde_chase_distance: 8,
              no_up_cells: [[11, 12], [11, 15], [23, 12], [23, 15]]},
         release_ticks: [0, 10, 20, 30], score_dot: 10, score_energizer: 50,
         watchdog_ticks: 20000, power_s: 6, pacman_dot_speed: 0.71,
         house_personal_dots: [0, 0, 30, 60], house_global_dots: [7, 17, 32],
         house_no_dot_s: 4, pacman_power_speed: 0.90, pacman_power_dot_speed: 0.79,
         fly_frightened_speed: 0.50, score_ghosts: [200, 400, 800, 1600],
         fruit_s: 9.5, fruit_dots_eaten: [70, 170], score_fruit: 100,
         elroy_dots_left: [20, 10], elroy_speeds: [0.80, 0.85],
         fly_tunnel_speed: 0.40, pacman_normal_speed_cap: 0.80,
         fly_normal_speed_cap: 0.75}  # TODO(M1, 미결 8): 속도·타이머 참고값은 M1에서 확인
time:   {v_max_tiles_per_s: 9.47}
odor:   {D: 1.0, lam: 0.05, s: 1.0, c0: 0.01, reset_on_life_loss: true}
phero:  {D: 1.0, lam: 0.1}                 # 체제3만 쓴다. TODO(미결 5)
pacman: {kind: ppo, checkpoint: runs/pacman/v1/checkpoints/best.pt, device: cuda, eps: 0.0}  # 장치는 명시한다: cpu와 cuda는 결과가 달라 짝지은 비교는 같은 장치일 때만 성립 (DECISIONS 22). eps 0.0은 DECISIONS 24로 정함
ghosts: {kind: flybrain, config: configs/brain_v1.yaml}
replay: {keep_games: [], brain: false}
run:    {max_loop_ticks: 2000000}
weights: {every_games: 100}          # 26.1. 30판이면 마지막 판 파일만 생긴다
scale:
  conditions: [regime1, regime2, regime3, b0, b1]
  batches:                           # 2.1
    - {name: S, split: 1, sequential: true}
    - {name: A, split: 1, sequential: false}
    - {name: B, split: 2, sequential: false}
  budget_hours: 8
  safety_factor: 1.5
  n_games_candidates: [1000, 2000, 3000]
  eval_games: 200                    # 26.4
  main_seeds: [8000, 8001, 8002, 8003, 8004, 8005, 8006, 8007, 8008, 8009]
