# 본 실험 (M5): 다섯 조건을 판 3000, 시드 8000 ~ 8009로 학습한다. 규모는 DECISIONS 27.4 (측정 결과는 27.5).
# 실행 (고른 배치 A: 조건당 프로세스 하나, 시드 10개 한 묶음, 동시에. 비트 단위 재현은 이 배치만 보장한다, 27.5):
#   uv run --extra pacman python scripts/run_parallel.py configs/main_v1.yaml \
#     --conditions regime1,regime2,regime3,b0,b1 --split 1
# 학습 가중치는 100판마다와 마지막 판에 저장한다 (DECISIONS 26.1). 학습 뒤 최종 평가는 26.4 (configs/final_eval_v1.yaml).
# engine · time · odor · pacman 블록은 configs/integ_v1.yaml에서 값을 바꾸지 않고 복사했다 (pacman에는 checkpoint_sha256만 더했다, 28.3).
# phero 블록은 DECISIONS 29 (integ_v1은 자리표시).
# run.max_loop_ticks는 판 수에 맞췄다 (28.2, 33.3).
# `condition`, `ghosts`(b1이면 original)는 run_parallel.py가 조건마다 채운다. 아래 ghosts는 b1이 아닌 조건의 뇌.
# 관련: DECISIONS 24 (ε), 26 (가중치 저장 · 최종 평가), 27 (규모), 28 (점검 처리: 한도 · 체크포인트 해시), 35 (재생 일정). 이 파일은 관리자 소유다.
experiment: main_v1
seeds: [8000, 8001, 8002, 8003, 8004, 8005, 8006, 8007, 8008, 8009]
n_games: 3000

engine: {kind: real, lives: 3, pacman_speed: 1.0, fly_speed: 1.0,
         b1: {force_reversal: original, scatter_chase_s: [7, 20, 7, 20, 5, 20, 5],
              scatter_targets: [[-3, 25], [-3, 2], [31, 27], [31, 0]],
              pinky_ahead: 4, inky_ahead: 2, clyde_chase_distance: 8,
              no_up_cells: [[11, 12], [11, 15], [23, 12], [23, 15]]},
         release_ticks: [0, 10, 20, 30], score_dot: 10, score_energizer: 50,  # 가짜 엔진 전용, 진짜 엔진은 읽지 않는다 (DECISIONS 33.5)
         watchdog_ticks: 20000, power_s: 6, pacman_dot_speed: 0.71,
         house_personal_dots: [0, 0, 30, 60], house_global_dots: [7, 17, 32],
         house_no_dot_s: 4, pacman_power_speed: 0.90, pacman_power_dot_speed: 0.79,
         fly_frightened_speed: 0.50, score_ghosts: [200, 400, 800, 1600],
         fruit_s: 9.5, fruit_dots_eaten: [70, 170], score_fruit: 100,
         elroy_dots_left: [20, 10], elroy_speeds: [0.80, 0.85],
         fly_tunnel_speed: 0.40, pacman_normal_speed_cap: 0.80,
         fly_normal_speed_cap: 0.75}  # DECISIONS 32.1
time:   {v_max_tiles_per_s: 9.47}
odor:   {D: 1.0, lam: 0.05, s: 1.0, c0: 0.01, reset_on_life_loss: true}
phero:  {D: 4.0, lam: 0.05, gain: 0.5922}   # 체제3만 쓴다. DECISIONS 29
pacman: {kind: ppo, checkpoint: runs/pacman/v1/checkpoints/best.pt, checkpoint_sha256: 4670fad239ee6324464b231cbe944afe8993167fbe20e1909fc23648b61e07f8, device: cuda, eps: 0.0}  # 장치는 명시한다: cpu와 cuda는 결과가 달라 짝지은 비교는 같은 장치일 때만 성립 (DECISIONS 22). eps 0.0은 DECISIONS 24로 정함
ghosts: {kind: flybrain, config: configs/brain_v1.yaml}
# 재생: 판 1과 10의 배수 301개 (DECISIONS 35.2, 추정 용량 35.9). 28.5 · 28.8의 일정(판 1과 100의 배수)을 포함한다
