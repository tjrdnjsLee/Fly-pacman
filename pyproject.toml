[project]
name = "flypac"
version = "0.0.1"
description = "Fly Pacman: Drosophila mushroom-body ghosts playing Pac-Man"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
pacman = ["torch"]
viz = ["pygame", "imageio-ffmpeg", "matplotlib", "manim>=0.19"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flypac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
